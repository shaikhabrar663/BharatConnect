<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <!-- Modern Geometric Nexus Brand Mark: High-Tech, Scalable & Instantly Recognizable -->
  <defs>
    <linearGradient id="nexus-saffron" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FF7B25" />
      <stop offset="100%" stop-color="#EA580C" />
    </linearGradient>
    <linearGradient id="nexus-cobalt" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#3B82F6" />
      <stop offset="100%" stop-color="#1D4ED8" />
    </linearGradient>
    <linearGradient id="nexus-emerald" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10B981" />
      <stop offset="100%" stop-color="#047857" />
    </linearGradient>
    <linearGradient id="nexus-core" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="100%" stop-color="#F1F5F9" />
    </linearGradient>
    <filter id="soft-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#0B132B" flood-opacity="0.25" />
    </filter>
  </defs>

  <!-- Modern Geometric Hexagonal Nexus Structure -->
  <g filter="url(#soft-glow)">
    <!-- Top-Right Dynamic Facet (Solar Saffron) -->
    <path 
      d="M 100 24 L 168 62 L 134 100 L 100 80 Z" 
      fill="url(#nexus-saffron)" 
    />
    <!-- Right-Bottom Facet (Deep Saffron Shadow for 3D depth) -->
    <path 
      d="M 168 62 L 168 138 L 134 100 Z" 
      fill="#C2410C" 
      opacity="0.9"
    />

    <!-- Bottom-Left Dynamic Facet (India Emerald) -->
    <path 
      d="M 168 138 L 100 176 L 100 120 L 134 100 Z" 
      fill="url(#nexus-emerald)" 
    />
    <!-- Bottom Anchor Facet -->
    <path 
      d="M 100 176 L 32 138 L 66 100 L 100 120 Z" 
      fill="#065F46" 
      opacity="0.95"
    />

    <!-- Top-Left Dynamic Facet (Deep Tech Cobalt / Ultramarine) -->
    <path 
      d="M 32 138 L 32 62 L 66 100 Z" 
      fill="#1E40AF" 
      opacity="0.9"
    />
    <path 
      d="M 32 62 L 100 24 L 100 80 L 66 100 Z" 
      fill="url(#nexus-cobalt)" 
    />

    <!-- Central Precision Diamond Core (Frontier Intelligence Node) -->
    <polygon 
      points="100,68 132,100 100,132 68,100" 
      fill="#0F172A" 
      stroke="#1E293B" 
      stroke-width="1.5"
    />

    <!-- Luminous Spark Core -->
    <polygon 
      points="100,78 122,100 100,122 78,100" 
      fill="url(#nexus-core)" 
    />

    <!-- Inner Neural Nexus Star -->
    <circle cx="100" cy="100" r="4" fill="#2563EB" />
  </g>
</svg>
